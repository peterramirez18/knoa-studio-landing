name: Deploy landing to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: landing-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Deploy dist/ via FTP (lftp)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.SERVER }}" <<'EOF'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          mirror -R --delete --verbose dist/ ./knoastudio.com/public_html/
          bye
          EOF
